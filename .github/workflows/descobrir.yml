name: Descobrir ids das contas

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  descobrir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descobrir
        env:
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION || 'v23.0' }}
          TOKEN_BRASIL2359: ${{ secrets.TOKEN_BRASIL2359 }}
          TOKEN_BRAZILONABUDGET: ${{ secrets.TOKEN_BRAZILONABUDGET }}
          TOKEN_LLSHOP: ${{ secrets.TOKEN_LLSHOP }}
        run: python scripts/descobrir_ids.py
      - name: Gravar
        run: |
          git config user.name "central-de-postagem"
          git config user.email "actions@users.noreply.github.com"
          git add config/contas.json
          git diff --cached --quiet || (git commit -m "Ids das contas descobertos" && git push)
