name: Contar votos dos duelos

on:
  schedule:
    - cron: "11 3 * * *"   # 00:11 de Brasília, antes do robô "Posts do dia" (00:41)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gravar-dados
  cancel-in-progress: false

jobs:
  contar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Contar votos
        env:
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION || 'v23.0' }}
          TOKEN_BRASIL2359: ${{ secrets.TOKEN_BRASIL2359 }}
          TOKEN_BRAZILONABUDGET: ${{ secrets.TOKEN_BRAZILONABUDGET }}
          TOKEN_LLSHOP: ${{ secrets.TOKEN_LLSHOP }}
        run: python scripts/contar_duelos.py
      - name: Gravar
        run: |
          git config user.name "central-de-postagem"
          git config user.email "actions@users.noreply.github.com"
          git add dados/duelos.json
          git diff --cached --quiet && exit 0
          git commit -m "Votos dos duelos" -q
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
