name: Publicar posts aprovados

on:
  schedule:
    - cron: "7,37 * * * *"   # a cada 30 minutos
  workflow_dispatch:
    inputs:
      simular:
        description: "Só simular (não publica nada)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Conferir a fila
        run: python scripts/validar.py
      - name: Publicar
        env:
          SIMULAR: ${{ github.event_name == 'workflow_dispatch' && inputs.simular && '1' || '0' }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION || 'v23.0' }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          TOKEN_BRASIL2359: ${{ secrets.TOKEN_BRASIL2359 }}
          TOKEN_BRAZILONABUDGET: ${{ secrets.TOKEN_BRAZILONABUDGET }}
          TOKEN_LLSHOP: ${{ secrets.TOKEN_LLSHOP }}
        run: python scripts/publicar.py
      - name: Gravar o resultado na fila
        if: always()
        run: |
          git config user.name "central-de-postagem"
          git config user.email "actions@users.noreply.github.com"
          git add fila
          git diff --cached --quiet || (git commit -m "Resultado da publicação $(date -u +%FT%TZ)" && git push)
