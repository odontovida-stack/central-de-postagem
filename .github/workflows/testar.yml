name: Testar conexão com a Meta

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testar
        env:
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION || 'v23.0' }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          TOKEN_BRASIL2359: ${{ secrets.TOKEN_BRASIL2359 }}
          TOKEN_BRAZILONABUDGET: ${{ secrets.TOKEN_BRAZILONABUDGET }}
          TOKEN_LLSHOP: ${{ secrets.TOKEN_LLSHOP }}
        run: python scripts/testar_conexao.py
      - name: Gravar
        run: |
          git config user.name "central-de-postagem"
          git config user.email "actions@users.noreply.github.com"
          git add dados
          git diff --cached --quiet || (git commit -m "Teste de conexão $(date -u +%FT%TZ)" && git push)
