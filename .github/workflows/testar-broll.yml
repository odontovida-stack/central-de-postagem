name: Testar B-roll

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar ffmpeg e Playwright
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install pillow playwright
          python -m playwright install --with-deps chromium
      - name: Montar os trechos de teste
        env:
          TEMA_SLIDES: taf
        run: |
          mkdir -p previa/broll
          for i in 1 2 3 4 5; do
            mkdir -p saida-youtube/t$i
            if python gerador/youtube/broll.py gerador/youtube/teste-broll-$i saida-youtube/t$i > previa/broll/log-$i.txt 2>&1; then
              cp saida-youtube/t$i/001.png previa/broll/t$i-quadro.png
              ffmpeg -y -loglevel error -ss 0 -i saida-youtube/t$i/001.mp4 -frames:v 1 -vf "select=eq(n\,120)" previa/broll/t$i-q4s.png || true
              cp gerador/youtube/teste-broll-$i/broll_creditos.json previa/broll/t$i-creditos.json || true
            fi
          done
      - name: Gravar a prévia
        run: |
          git config user.name "central-de-postagem"
          git config user.email "actions@users.noreply.github.com"
          git add -f previa/broll
          git commit -m "Prévia do teste de B-roll" || exit 0
          for i in 1 2 3; do git push && exit 0; git pull --rebase; done
