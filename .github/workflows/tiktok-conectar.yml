name: Conectar TikTok

on:
  workflow_dispatch:
    inputs:
      conta:
        description: "Qual página"
        type: choice
        options: [brasil2359, brazilonabudget, jogosnatela, esportesnatela, tudooqueestreia, lancamentosdegames, showsconfirmados]
      codigo:
        description: "Código que apareceu na página do TikTok (vale poucos minutos)"
        required: true

permissions:
  contents: write

jobs:
  conectar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Trocar o código pela autorização
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_CHAVE: ${{ secrets.TIKTOK_CHAVE }}
        run: |
          echo "::add-mask::${{ inputs.codigo }}"
          python scripts/tiktok.py conectar "${{ inputs.conta }}" "${{ inputs.codigo }}"
          python scripts/tiktok.py status
      - name: Gravar
        run: |
          git config user.name "central-de-postagem"
          git config user.email "actions@users.noreply.github.com"
          git add dados/tiktok.enc
          git commit -m "TikTok conectado: ${{ inputs.conta }}"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
